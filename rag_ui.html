<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local RAG + Llama Console</title>
    <style>
        :root {
            --bg: #0b1120;
            --panel: #111827;
            --card: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --muted: #94a3b8;
            --blue: #3b82f6;
            --green: #10b981;
            --purple: #8b5cf6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
        }

        /* Left Sidebar: ChromaDB Memory Store */
        aside {
            width: 310px;
            background: var(--panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 14px;
        }

        aside h2 {
            font-size: 15px;
            color: #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 2px 8px;
            border-radius: 99px;
            font-size: 11px;
            color: var(--green);
        }

        textarea {
            width: 100%;
            height: 74px;
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            font-size: 13px;
            resize: none;
            outline: none;
        }

        button {
            background: var(--blue);
            color: #fff;
            border: none;
            padding: 9px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.92;
        }

        button.save-btn {
            background: var(--green);
            color: #052e16;
            width: 100%;
        }

        button.ghost {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 5px 10px;
            font-size: 12px;
        }

        #memory-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .mem-item {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 9px 11px;
            font-size: 12px;
            line-height: 1.4;
            color: #cbd5e1;
        }

        .mem-id {
            font-size: 10px;
            color: var(--muted);
            margin-bottom: 3px;
            font-family: monospace;
        }

        /* Main Chat Area */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        header {
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .pipeline-pill {
            font-size: 12px;
            padding: 5px 12px;
            border-radius: 99px;
            background: var(--card);
            border: 1px solid var(--border);
            color: #93c5fd;
        }

        select {
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 7px 12px;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .msg {
            max-width: 78%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.55;
            white-space: pre-wrap;
        }

        .user {
            background: var(--blue);
            align-self: flex-end;
            border-bottom-right-radius: 3px;
        }

        .bot {
            background: var(--card);
            border: 1px solid var(--border);
            align-self: flex-start;
            border-bottom-left-radius: 3px;
        }

        .meta {
            font-size: 11px;
            color: var(--muted);
            margin-bottom: 5px;
            font-weight: 600;
        }

        .sources {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px dashed var(--border);
            font-size: 12px;
            color: #86efac;
        }

        footer {
            background: var(--panel);
            border-top: 1px solid var(--border);
            padding: 14px 20px;
            display: flex;
            gap: 10px;
        }

        #prompt {
            flex: 1;
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 11px 14px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
    </style>
</head>

<body>

    <aside>
        <h2>ChromaDB Memory <span id="mem-count" class="badge">0 items</span></h2>
        <textarea id="fact-input"
            placeholder="Save a permanent fact (e.g. 'Sathvika is my wife' or 'TCS target is ₹4200')..."></textarea>
        <button class="save-btn" onclick="saveMemory()">+ Save to ChromaDB</button>
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size:12px; color:var(--muted);">Stored Records</span>
            <button class="ghost" onclick="loadMemories()">Refresh</button>
        </div>
        <div id="memory-list"></div>
    </aside>

    <main>
        <header>
            <div>
                <strong>Local AI Workspace</strong>
                <span id="flow-label" class="pipeline-pill" style="margin-left:10px;">UI → ChromaDB (RAG) → Llama
                    3.1:8b</span>
            </div>
            <div style="display:flex; gap:8px; align-items:center;">
                <select id="mode" onchange="updateFlowLabel()">
                    <option value="rag">RAG Mode (ChromaDB + Llama 3.1)</option>
                    <option value="direct">Direct Mode (Raw Llama 3.1 Only)</option>
                </select>
                <button class="ghost" onclick="document.getElementById('chat').innerHTML=''">Clear Chat</button>
            </div>
        </header>

        <div id="chat">
            <div class="msg bot">
                <div class="meta">SYSTEM READY</div>
                Connected to FastAPI (port 5000). Use <b>RAG Mode</b> to query your stored ChromaDB facts & stock notes,
                or switch to <b>Direct Mode</b> for general Llama 3.1 chat.
            </div>
        </div>

        <footer>
            <input type="text" id="prompt" placeholder="Ask about your stored facts, watchlist, or general questions..."
                onkeydown="if(event.key==='Enter') sendQuery()" />
            <button onclick="sendQuery()">Send</button>
        </footer>
    </main>

    <script>
        const API = "http://localhost:5000";

        function updateFlowLabel() {
            const mode = document.getElementById("mode").value;
            document.getElementById("flow-label").textContent =
                mode === "rag" ? "UI → ChromaDB (RAG) → Llama 3.1:8b" : "UI → Direct Llama 3.1:8b (No DB)";
        }

        async function loadMemories() {
            const list = document.getElementById("memory-list");
            try {
                const res = await fetch(`${API}/memories`);
                const data = await res.json();
                document.getElementById("mem-count").textContent = `${data.count} items`;
                list.innerHTML = data.items.map(item => `
        <div class="mem-item">
          <div class="mem-id">${item.id}</div>
          ${item.text.replace(/</g, "&lt;")}
        </div>
      `).join("");
            } catch {
                list.innerHTML = `<div class="mem-item" style="color:#fca5a5;">Cannot reach localhost:5000. Run <b>python server.py</b> first.</div>`;
            }
        }

        async function saveMemory() {
            const input = document.getElementById("fact-input");
            const fact = input.value.trim();
            if (!fact) return;
            input.value = "";
            await fetch(`${API}/remember`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ fact })
            });
            loadMemories();
        }

        function addBubble(sender, text, isUser = false, sources = []) {
            const chat = document.getElementById("chat");
            const div = document.createElement("div");
            div.className = "msg " + (isUser ? "user" : "bot");
            let srcHtml = "";
            if (sources && sources.length > 0) {
                srcHtml = `<div class="sources"><b>Retrieved from ChromaDB:</b><br>• ${sources.map(s => s.replace(/</g, "&lt;")).join("<br>• ")}</div>`;
            }
            div.innerHTML = `<div class="meta">${sender}</div>${text.replace(/</g, "&lt;")}${srcHtml}`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return div;
        }

        async function sendQuery() {
            const promptEl = document.getElementById("prompt");
            const text = promptEl.value.trim();
            if (!text) return;
            promptEl.value = "";

            const mode = document.getElementById("mode").value;
            addBubble("YOU", text, true);
            const botDiv = addBubble(mode === "rag" ? "CHROMA RAG → LLAMA 3.1" : "DIRECT LLAMA 3.1", "Thinking...");

            try {
                const endpoint = mode === "rag" ? "/rag-ask" : "/direct-ask";
                const res = await fetch(`${API}${endpoint}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ question: text })
                });
                const data = await res.json();
                let srcHtml = "";
                if (data.sources && data.sources.length > 0) {
                    srcHtml = `<div class="sources"><b>Retrieved from ChromaDB:</b><br>• ${data.sources.map(s => s.replace(/</g, "&lt;")).join("<br>• ")}</div>`;
                }
                botDiv.innerHTML = `<div class="meta">${mode === "rag" ? "CHROMA RAG → LLAMA 3.1" : "DIRECT LLAMA 3.1"}</div>${data.response.replace(/</g, "&lt;")}${srcHtml}`;
            } catch {
                botDiv.innerHTML = `<div class="meta">ERROR</div>Server offline. Run <b>python server.py</b> in your VS Code terminal.`;
            }
        }

        loadMemories();
    </script>
</body>

</html>
