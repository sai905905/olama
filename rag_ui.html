<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local RAG + Web + Llama Console</title>
    <style>
        :root {
            --bg: #0b1120;
            --panel: #111827;
            --card: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --muted: #94a3b8;
            --blue: #3b82f6;
            --green: #10b981;
            --purple: #8b5cf6;
            --red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
        }

        aside {
            width: 320px;
            background: var(--panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 14px;
            gap: 10px;
            overflow-y: auto;
        }

        aside h2 {
            font-size: 14px;
            color: #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 2px 8px;
            border-radius: 99px;
            font-size: 11px;
            color: var(--green);
        }

        .badge.purple {
            color: #c4b5fd;
        }

        textarea,
        input.rule-box {
            width: 100%;
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 12.5px;
            outline: none;
        }

        textarea {
            height: 62px;
            resize: none;
        }

        button {
            background: var(--blue);
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        button.save-btn {
            background: var(--green);
            color: #052e16;
            width: 100%;
        }

        button.rule-btn {
            background: var(--purple);
            color: #fff;
            width: 100%;
        }

        button.ghost {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 4px 9px;
            font-size: 11.5px;
        }

        button.del-btn {
            background: transparent;
            color: var(--red);
            padding: 0 4px;
            font-size: 13px;
        }

        .list-box {
            max-height: 180px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .mem-item {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 12px;
            line-height: 1.4;
            color: #cbd5e1;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 6px;
        }

        .mem-id {
            font-size: 10px;
            color: var(--muted);
            margin-bottom: 2px;
            font-family: monospace;
        }

        hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 4px 0;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        header {
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .pipeline-pill {
            font-size: 12px;
            padding: 5px 12px;
            border-radius: 99px;
            background: var(--card);
            border: 1px solid var(--border);
            color: #93c5fd;
        }

        select {
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 7px 12px;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .msg {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.55;
            white-space: pre-wrap;
        }

        .user {
            background: var(--blue);
            align-self: flex-end;
            border-bottom-right-radius: 3px;
        }

        .bot {
            background: var(--card);
            border: 1px solid var(--border);
            align-self: flex-start;
            border-bottom-left-radius: 3px;
        }

        .meta {
            font-size: 11px;
            color: var(--muted);
            margin-bottom: 5px;
            font-weight: 600;
        }

        .fallback-bar {
            margin-top: 12px;
            padding: 10px;
            border-radius: 8px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--border);
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .fallback-label {
            width: 100%;
            font-size: 12px;
            color: #fcd34d;
            margin-bottom: 2px;
        }

        .sources {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px dashed var(--border);
            font-size: 11.5px;
            color: #86efac;
            word-break: break-word;
        }

        footer {
            background: var(--panel);
            border-top: 1px solid var(--border);
            padding: 14px 20px;
        }

        .quick-options {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            align-items: center;
            font-size: 12px;
            color: var(--muted);
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        #prompt {
            flex: 1;
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 11px 14px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
    </style>
</head>

<body>

    <aside>
        <h2>Global AI Rules <span id="rule-count" class="badge purple">0 rules</span></h2>
        <input type="text" id="rule-input" class="rule-box"
            placeholder="e.g. 'Keep replies under 2 lines & be realistic'"
            onkeydown="if(event.key==='Enter') saveRule()" />
        <button class="rule-btn" onclick="saveRule()">+ Add Active Rule</button>
        <div id="rules-list" class="list-box"></div>

        <hr />

        <h2>ChromaDB Memory <span id="mem-count" class="badge">0 items</span></h2>
        <textarea id="fact-input" placeholder="Save a permanent fact (e.g. 'Sathvika is my wife')..."></textarea>
        <button class="save-btn" onclick="saveMemory()">+ Save to ChromaDB</button>
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size:11.5px; color:var(--muted);">Stored Records</span>
            <button class="ghost" onclick="loadAll()">Refresh</button>
        </div>
        <div id="memory-list" class="list-box" style="max-height:none; flex:1;"></div>
    </aside>

    <main>
        <header>
            <div>
                <strong>Local AI Workspace</strong>
                <span id="flow-label" class="pipeline-pill" style="margin-left:10px;">1. Check ChromaDB → 2. Offer Llama
                    / Web Search</span>
            </div>
            <div style="display:flex; gap:8px; align-items:center;">
                <select id="mode" onchange="updateFlowLabel()">
                    <option value="rag">Smart RAG (DB First + Fallback Options)</option>
                    <option value="web">Internet & News Search (Web RAG)</option>
                    <option value="agent">Agent Mode (ChromaDB + Live NSE + News Tools)</option>
                    <option value="direct">Llama 3.1 Model Only (No DB/Web)</option>
                </select>
                <button class="ghost" onclick="document.getElementById('chat').innerHTML=''">Clear Chat</button>
            </div>
        </header>

        <div id="chat">
            <div class="msg bot">
                <div class="meta">SYSTEM READY</div>
                Your <b>Global AI Rules</b> apply automatically to every reply across ChromaDB RAG, Live Web Search, and
                Direct Llama 3.1.
            </div>
        </div>

        <footer>
            <div class="quick-options">
                <span>Search source:</span>
                <button class="ghost" onclick="setMode('rag')">1. ChromaDB First</button>
                <button class="ghost" onclick="setMode('direct')">2. Llama 3.1 Model</button>
                <button class="ghost" onclick="setMode('web')">3. Internet & News</button>
            </div>
            <div class="input-row">
                <input type="text" id="prompt" placeholder="Ask about your stored facts, watchlist, or latest news..."
                    onkeydown="if(event.key==='Enter') sendQuery()" />
                <button onclick="sendQuery()">Send</button>
            </div>
        </footer>
    </main>

    <script>
        const API = "http://localhost:5000";

        function setMode(val) {
            document.getElementById("mode").value = val;
            updateFlowLabel();
        }

        function updateFlowLabel() {
            const mode = document.getElementById("mode").value;
            const labels = {
                rag: "1. Check ChromaDB → 2. Offer Llama / Web Search",
                web: "UI → Live Internet & News → Llama 3.1 Summary",
                direct: "UI → Direct Llama 3.1:8b Model"
            };
            document.getElementById("flow-label").textContent = labels[mode];
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        async function loadRules() {
            const list = document.getElementById("rules-list");
            try {
                const res = await fetch(`${API}/rules`);
                const data = await res.json();
                document.getElementById("rule-count").textContent = `${data.count} rules`;
                list.innerHTML = data.items.map(item => `
        <div class="mem-item">
          <span>${escapeHtml(item.rule)}</span>
          <button class="del-btn" title="Delete rule" onclick="deleteRule('${item.id}')">✕</button>
        </div>
      `).join("");
            } catch {
                list.innerHTML = "";
            }
        }

        async function saveRule() {
            const input = document.getElementById("rule-input");
            const rule = input.value.trim();
            if (!rule) return;
            input.value = "";
            await fetch(`${API}/rules`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ rule })
            });
            loadRules();
        }

        async function deleteRule(ruleId) {
            await fetch(`${API}/rules/${ruleId}`, { method: "DELETE" });
            loadRules();
        }

        async function loadMemories() {
            const list = document.getElementById("memory-list");
            try {
                const res = await fetch(`${API}/memories`);
                const data = await res.json();
                document.getElementById("mem-count").textContent = `${data.count} items`;
                list.innerHTML = data.items.map(item => `
        <div class="mem-item">
          <div>
            <div class="mem-id">${escapeHtml(item.id)}</div>
            ${escapeHtml(item.text)}
          </div>
        </div>
      `).join("");
            } catch {
                list.innerHTML = `<div class="mem-item" style="color:#fca5a5;">Cannot reach localhost:5000. Run <b>python server.py</b> first.</div>`;
            }
        }

        function loadAll() {
            loadRules();
            loadMemories();
        }

        async function saveMemory(customFact = null) {
            const input = document.getElementById("fact-input");
            const fact = (customFact || input.value).trim();
            if (!fact) return;
            if (!customFact) input.value = "";
            await fetch(`${API}/remember`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ fact })
            });
            loadMemories();
        }

        function addBubble(sender, htmlContent, isUser = false) {
            const chat = document.getElementById("chat");
            const div = document.createElement("div");
            div.className = "msg " + (isUser ? "user" : "bot");
            div.innerHTML = `<div class="meta">${sender}</div>${htmlContent}`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return div;
        }

        async function runFallback(type, encodedQuestion) {
            const question = decodeURIComponent(encodedQuestion);
            const label = type === "web" ? "INTERNET & NEWS RAG → LLAMA 3.1" : "DIRECT LLAMA 3.1 MODEL";
            const endpoint = type === "web" ? "/web-rag" : "/ask";
            const botDiv = addBubble(label, type === "web" ? "Searching internet & news, then summarizing..." : "Asking Llama 3.1...");

            try {
                const res = await fetch(`${API}${endpoint}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ question })
                });
                const data = await res.json();
                let srcHtml = "";
                if (data.sources && data.sources.length > 0) {
                    srcHtml = `<div class="sources"><b>Internet / News Sources:</b><br>• ${data.sources.map(escapeHtml).join("<br>• ")}</div>`;
                }
                const saveSnippet = encodeURIComponent(`${question} -> ${data.response}`);
                const saveBtn = `<div style="margin-top:10px;"><button class="ghost" onclick="saveMemory(decodeURIComponent('${saveSnippet}')); this.textContent='Saved to ChromaDB!'">+ Save Answer to ChromaDB</button></div>`;
                botDiv.innerHTML = `<div class="meta">${label}</div>${escapeHtml(data.response)}${srcHtml}${saveBtn}`;
            } catch {
                botDiv.innerHTML = `<div class="meta">ERROR</div>Server offline. Run <b>python server.py</b>.`;
            }
        }

        async function sendQuery() {
            const promptEl = document.getElementById("prompt");
            const text = promptEl.value.trim();
            if (!text) return;
            promptEl.value = "";

            const mode = document.getElementById("mode").value;
            addBubble("YOU", escapeHtml(text), true);

            if (mode === "web" || mode === "direct") {
                await runFallback(mode, encodeURIComponent(text));
                return;
            }

            if (mode === "agent") {
                const botDiv = addBubble("AI AGENT (TOOLS + LLAMA)", "Planning & calling live tools...");
                const res = await fetch(`${API}/agent-ask`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ question: text })
                }).then(r => r.json());

                let traceHtml = "";
                if (res.tool_trace && res.tool_trace.length > 0) {
                    traceHtml = `<div class="sources"><b>Tools Executed by Agent:</b><br>• ` +
                    res.tool_trace.map(t => `${escapeHtml(t.tool)}(${escapeHtml(JSON.stringify(t.args))})`).join("<br>• ") +
                    `</div>`;
                }
                botDiv.innerHTML = `<div class="meta">AI AGENT (TOOLS + LLAMA)</div>${escapeHtml(res.response)}${traceHtml}`;
                return;
                }

            const botDiv = addBubble("CHROMA RAG → LLAMA 3.1", "Searching ChromaDB...");
            try {
                const res = await fetch(`${API}/rag-ask`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ question: text })
                });
                const data = await res.json();

                let fallbackHtml = "";
                if (data.found_in_db === false) {
                    const enc = encodeURIComponent(text);
                    fallbackHtml = `
          <div class="fallback-bar">
            <div class="fallback-label">Not found in your local ChromaDB. Where should I look next?</div>
            <button style="background:#7c3aed" onclick="runFallback('direct', '${enc}')">Ask Llama 3.1 Model</button>
            <button style="background:#0284c7" onclick="runFallback('web', '${enc}')">Search Internet & News</button>
          </div>
        `;
                }

                let srcHtml = "";
                if (data.found_in_db && data.sources && data.sources.length > 0) {
                    srcHtml = `<div class="sources"><b>Matched in ChromaDB:</b><br>• ${data.sources.map(escapeHtml).join("<br>• ")}</div>`;
                }

                botDiv.innerHTML = `<div class="meta">CHROMA RAG → LLAMA 3.1</div>${escapeHtml(data.response)}${fallbackHtml}${srcHtml}`;
            } catch {
                botDiv.innerHTML = `<div class="meta">ERROR</div>Server offline. Run <b>python server.py</b> in VS Code.`;
            }
        }

        loadAll();
    </script>
</body>

</html>
