<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Chatbot</title>
    <style>
        /* Basic styling for a simple chat interface */
        #chat-container {
            width: 300px;
            height: 400px;
            border: 1px solid #ccc;
            padding: 10px;
            overflow-y: auto;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        #input-container {
            margin-top: 20px;
        }

        #input-field {
            width: 100%;
            height: 40px;
            padding: 10px;
            font-size: 18px;
        }

        #send-btn {
            background-color: #4CAF50;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #send-btn:hover {
            background-color: #3e8e41;
        }
    </style>
</head>

<body>
    <div id="chat-container">
        <div id="chat-log"></div>
        <div id="input-container">
            <input id="input-field" type="text" placeholder="Type a message...">
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script>
        // Example responses for the chatbot
        const responses = {
            "hello": "Hello! How can I help you today?",
            "how are you": "I'm doing great, thank you for asking!",
            "default": "I didn't understand your message. Please rephrase it."
        };

        // Get elements
        const chatLog = document.getElementById('chat-log');
        const inputField = document.getElementById('input-field');
        const sendBtn = document.getElementById('send-btn');

        // Function to handle send button click
        sendBtn.addEventListener('click', () => {
            const message = inputField.value.trim().toLowerCase();
            if (message) {
                const response = responses[message] || responses['default'];
                chatLog.innerHTML += `<p>Chatbot: ${response}</p>`;
                inputField.value = '';
            }
        });
    </script>
</body>

</html>
